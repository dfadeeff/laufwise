name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (all extras)
        # test-mcp pins mcp<2 so the in-memory session harness resolves; see pyproject.
        run: pip install -e ".[dev,mcp,test-mcp]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests/ -q

  core-only:
    # The core package must stand alone: mcp/otel are extras, and the suite
    # must pass without them (mcp tests importorskip).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core only)
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest tests/ -q