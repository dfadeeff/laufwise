[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laufwise"
version = "0.1.0"
description = "Runbook-as-code harness: force agents to execute inside a process contract."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dmitry Fadeev", email = "fadejeff@gmail.com" }]
keywords = ["agents", "runbook", "process-contract", "verification", "mcp", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15"]
otel = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]
mcp = ["mcp>=1.2"]
# Test-harness-only pin, NOT a runtime constraint. tests/test_mcp_server.py drives the step
# session over two real in-memory MCP sessions, which needs `mcp.server.fastmcp.FastMCP` and
# `mcp.shared.memory.create_connected_server_and_client_session` — both removed in mcp 2.0
# (FastMCP became mcp.server.mcpserver; the helper became create_client_server_memory_streams).
# The runtime code is 2.0-clean: every API laufwise/mcp/server.py uses (mcp.types,
# server.lowlevel.Server, server.stdio.stdio_server, ClientSession, StdioServerParameters,
# client.stdio.stdio_client) is still present in 2.0, so the `mcp` extra above stays
# permissive — pinning users out of 2.0 would be false metadata. Porting the harness to the
# 2.0 API is separate work; until then CI installs this so the session tests still run.
test-mcp = ["mcp<2"]

[project.urls]
Homepage = "https://github.com/dfadeeff/laufwise"
Repository = "https://github.com/dfadeeff/laufwise"
Issues = "https://github.com/dfadeeff/laufwise/issues"

[project.scripts]
rh = "laufwise.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["laufwise"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Declared explicitly on purpose. Ruff's DEFAULT rule set changes between releases, and CI
# installs an unpinned ruff — so relying on the default means a green main can turn red with
# no commit to this repo (0.16 did exactly that). Selecting the set makes lint a property of
# the project, not of whichever ruff the runner happened to resolve.
#   E4/E7/E9,F  ruff's classic default: imports, statements, syntax, pyflakes
#   B           bugbear — real bug shapes (e.g. blind `except Exception` assertions)
#   BLE         blind-except — the engine has two deliberate `except Exception` catches
#               (evaluator faults must never escape untraced); enabling the rule makes each
#               one an explicit, annotated decision rather than an unremarked default
#   SIM         simplification
#   UP          pyupgrade, floored at the 3.11 baseline in requires-python
#   RUF         ruff's own rules
# Deliberately NOT enabled: E501 (line-too-long) and W292 — `line-length` above governs
# formatting intent, and neither earns a CI failure here.
select = ["E4", "E7", "E9", "F", "B", "BLE", "SIM", "UP", "RUF"]