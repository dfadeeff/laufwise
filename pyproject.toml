[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laufwise"
version = "0.1.0"
description = "Runbook-as-code harness: force agents to execute inside a process contract."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dmitry Fadeev", email = "fadejeff@gmail.com" }]
keywords = ["agents", "runbook", "process-contract", "verification", "mcp", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
otel = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/dfadeeff/laufwise"
Repository = "https://github.com/dfadeeff/laufwise"
Issues = "https://github.com/dfadeeff/laufwise/issues"

[project.scripts]
rh = "laufwise.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["laufwise"]

[tool.ruff]
line-length = 100