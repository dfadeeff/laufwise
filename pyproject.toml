[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laufwise"
version = "0.0.1"
description = "Runbook-as-code harness: force agents to execute inside a process contract."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
otel = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]
mcp = ["mcp>=1.2"]

[project.scripts]
rh = "laufwise.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["laufwise"]

[tool.ruff]
line-length = 100