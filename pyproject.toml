[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laufwise"
version = "0.1.0"
description = "Runbook-as-code harness: force agents to execute inside a process contract."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Dmitry Fadeev", email = "fadejeff@gmail.com" }]
keywords = ["agents", "runbook", "process-contract", "verification", "mcp", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "click>=8.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.15"]
otel = [
  "opentelemetry-api>=1.20",
  "opentelemetry-sdk>=1.20",
  "opentelemetry-exporter-otlp-proto-http>=1.20",
]
mcp = ["mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/dfadeeff/laufwise"
Repository = "https://github.com/dfadeeff/laufwise"
Issues = "https://github.com/dfadeeff/laufwise/issues"

[project.scripts]
rh = "laufwise.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["laufwise"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Declared explicitly on purpose. Ruff's DEFAULT rule set changes between releases, and CI
# installs an unpinned ruff — so relying on the default means a green main can turn red with
# no commit to this repo (0.16 did exactly that). Selecting the set makes lint a property of
# the project, not of whichever ruff the runner happened to resolve.
#   E4/E7/E9,F  ruff's classic default: imports, statements, syntax, pyflakes
#   B           bugbear — real bug shapes (e.g. blind `except Exception` assertions)
#   SIM         simplification
#   UP          pyupgrade, floored at the 3.11 baseline in requires-python
#   RUF         ruff's own rules
# Deliberately NOT enabled: E501 (line-too-long) and W292 — `line-length` above governs
# formatting intent, and neither earns a CI failure here.
select = ["E4", "E7", "E9", "F", "B", "SIM", "UP", "RUF"]